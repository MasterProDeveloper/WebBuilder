version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lovable-bolt-db
    environment:
      POSTGRES_USER: lovable
      POSTGRES_PASSWORD: lovable_secret
      POSTGRES_DB: lovable_bolt
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lovable -d lovable_bolt']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lovable-bolt-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lovable-bolt-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://lovable:lovable_secret@postgres:5432/lovable_bolt
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lovable-bolt-web
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
