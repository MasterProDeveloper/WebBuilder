    _listeners: [],
    
    get(key) { return this._state[key]; },
    set(updates) {
      Object.assign(this._state, updates);
      this._listeners.forEach(fn => fn(this._state));
    },
    subscribe(fn) { this._listeners.push(fn); },
    
    init() {
      const saved = localStorage.getItem('lovable_bolt_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          Object.assign(this._state, parsed);
          if (this._state.isAuthenticated && this._state.user) {
            this._state.currentPage = 'dashboard';
          }
        } catch(e) {}
      }
    },
    
    save() {
      const toSave = { ...this._state };
      delete toSave._listeners;
      localStorage.setItem('lovable_bolt_state', JSON.stringify(toSave));
    }

      return "I'm here to help! Here's what I can do:\n\n1. **Analyze data** - Ask me about your metrics or trends\n2. **Manage tasks** - I can help organize your workflow\n3. **Generate reports** - Get summaries and insights\n4. **Make predictions** - Forecast future outcomes\n5. **Optimize processes** - Suggestions for improvement\n\nJust ask me anything!";

    return aiResponses[Math.floor(Math.random() * aiResponses.length)];

  // --- Render Engine ---
  function render() {
    const page = Store.get('currentPage');
    const app = document.getElementById('app');
    
    if (!Store.get('isAuthenticated') && !['landing', 'login', 'register'].includes(page)) {
      Store.set({ currentPage: 'landing' });
      render();
      return;
    }

    let html = '';
    switch(page) {
      case 'landing': html = renderLanding(); break;
      case 'login': html = renderLogin(); break;
      case 'register': html = renderRegister(); break;
      case 'dashboard': html = renderApp(renderDashboard()); break;
      case 'chat': html = renderApp(renderChat()); break;
      case 'tasks': html = renderApp(renderTasks()); break;
      case 'analytics': html = renderApp(renderAnalytics()); break;
      case 'settings': html = renderApp(renderSettings()); break;
      case 'admin': html = renderApp(renderAdmin()); break;
      case 'notifications': html = renderApp(renderNotifications()); break;
      default: html = renderLanding();
    }
    app.innerHTML = html;
    Store.save();
    attachEvents();
  }

  // --- Event Handlers ---
  function attachEvents() {
    // Login form
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        if (email && password.length >= 6) {
          const savedState = localStorage.getItem('lovable_bolt_state');
          let user = { firstName: 'User', lastName: '', email, role: 'admin' };
          if (savedState) {
            const parsed = JSON.parse(savedState);
            if (parsed.user && parsed.user.email === email) {
              user = parsed.user;
            }
          }
          Store.set({
            isAuthenticated: true,
            user: user,
            currentPage: 'dashboard',
            points: Store.get('points') || { points: 10, level: 1, streak_days: 1 },
          });
          addNotification('Welcome!', 'You have successfully logged in.', 'success');
          addPoints(10);
          render();
        }
      });
    }

    // Register form
    const regForm = document.getElementById('register-form');
    if (regForm) {
      regForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = {
          firstName: document.getElementById('reg-first').value,
          lastName: document.getElementById('reg-last').value,
          email: document.getElementById('reg-email').value,
          role: 'admin',
        };
        Store.set({
          isAuthenticated: true,
          user,
          currentPage: 'dashboard',
          points: { points: 10, level: 1, streak_days: 1 },
        });
        addNotification('Welcome!', 'Your account has been created. You earned 10 points!', 'success');
        render();
      });
    }

    // Chat form
    const chatForm = document.getElementById('chat-form');
    if (chatForm) {
      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;
        
        let msgs = Store.get('chatMessages') || [];
        let convos = Store.get('conversations') || [];
        let currentConv = Store.get('currentConversation');
        
        if (currentConv === null) {
          convos.push({ title: msg.substring(0, 40), createdAt: new Date().toISOString() });
          currentConv = convos.length - 1;
        }
        
        msgs.push({ role: 'user', content: msg });
        Store.set({ chatMessages: msgs, conversations: convos, currentConversation: currentConv });
        input.value = '';
        render();
        
        // Simulate AI thinking
        setTimeout(() => {
          const response = getAIResponse(msg);
          msgs = Store.get('chatMessages') || [];
          msgs.push({ role: 'assistant', content: response });
          Store.set({ chatMessages: msgs });
          addPoints(5);
          render();
          // Scroll to bottom
          const chatDiv = document.getElementById('chat-messages');
          if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
        }, 800 + Math.random() * 1200);
      });
    }

    // Task form
    const taskForm = document.getElementById('task-form');
    if (taskForm) {
      taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('task-title').value;
        const desc = document.getElementById('task-desc').value;
        const priority = document.getElementById('task-priority').value;
        const tasks = Store.get('tasks') || [];
        tasks.push({ title, description: desc, priority, status: 'pending', createdAt: new Date().toISOString() });
        Store.set({ tasks });
        addNotification('Task Created', `"${title}" has been added to your tasks.`, 'info');
        addPoints(5);
        hideCreateTask();
        render();
      });
    }

    // Settings form
    const settingsForm = document.getElementById('settings-form');
    if (settingsForm) {
      settingsForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const user = Store.get('user') || {};
        user.firstName = document.getElementById('set-first').value;
        user.lastName = document.getElementById('set-last').value;
        Store.set({ user });
        const saved = document.getElementById('settings-saved');
        if (saved) { saved.classList.remove('hidden'); setTimeout(() => saved.classList.add('hidden'), 3000); }
      });
    }

    // Scroll chat to bottom on load
    const chatDiv = document.getElementById('chat-messages');
    if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  // --- Action Functions ---
  function navigate(page) {
    Store.set({ currentPage: page });
    closeDropdowns();
    render();
  }
  window.navigate = navigate;

  function toggleSidebar() {
    Store.set({ sidebarOpen: !Store.get('sidebarOpen') });
    render();
  }
  window.toggleSidebar = toggleSidebar;

  function toggleDropdown(id) {
    const el = document.getElementById(id);
    if (el) {
      const wasHidden = el.classList.contains('hidden');
      closeDropdowns();
      if (wasHidden) el.classList.remove('hidden');
    }
  }
  window.toggleDropdown = toggleDropdown;

  function closeDropdowns() {
    document.querySelectorAll('#lang-menu, #user-menu').forEach(el => el.classList.add('hidden'));
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[onclick*="toggleDropdown"]')) closeDropdowns();
  });

  function changeLanguage(code) {
    const lang = languages.find(l => l.code === code);
    Store.set({ language: code });
    document.documentElement.lang = code;
    document.documentElement.dir = lang ? lang.dir : 'ltr';
    closeDropdowns();
    render();
  }
  window.changeLanguage = changeLanguage;

  function doLogout() {
    Store.set({ isAuthenticated: false, user: null, currentPage: 'landing' });
    closeDropdowns();
    render();
  }
  window.doLogout = doLogout;

  function newConversation() {
    Store.set({ chatMessages: [], currentConversation: null });
    render();
  }
  window.newConversation = newConversation;

  function loadConversation(idx) {
    // In this standalone version, we reset messages for simplicity
    Store.set({ currentConversation: idx, chatMessages: [] });
    render();
  }
  window.loadConversation = loadConversation;

  function showCreateTask() { document.getElementById('create-task-form')?.classList.remove('hidden'); }
  window.showCreateTask = showCreateTask;
  function hideCreateTask() { document.getElementById('create-task-form')?.classList.add('hidden'); }
  window.hideCreateTask = hideCreateTask;

  function setTaskFilter(f) { Store.set({ taskFilter: f }); render(); }
  window.setTaskFilter = setTaskFilter;

  function completeTask(idx) {
    const tasks = Store.get('tasks') || [];
    if (tasks[idx]) {
      tasks[idx].status = 'completed';
      Store.set({ tasks });
      addNotification('Task Completed', `"${tasks[idx].title}" marked as done!`, 'success');
      addPoints(20);
      render();
    }
  }
  window.completeTask = completeTask;

  function deleteTask(idx) {
    const tasks = Store.get('tasks') || [];
    if (tasks[idx]) {
      const title = tasks[idx].title;
      tasks.splice(idx, 1);
      Store.set({ tasks });
      addNotification('Task Deleted', `"${title}" has been removed.`, 'warning');
      render();
    }
  }
  window.deleteTask = deleteTask;

  function addNotification(title, message, type = 'info') {
    const notifs = Store.get('notifications') || [];
    notifs.unshift({ title, message, type, read: false, createdAt: new Date().toISOString() });
    Store.set({ notifications: notifs.slice(0, 50) });
  }

  function addPoints(amount) {
    const pts = Store.get('points') || { points: 0, level: 1, streak_days: 0 };
    pts.points += amount;
    pts.level = Math.max(1, Math.floor(pts.points / 100) + 1);
    pts.streak_days = Math.max(pts.streak_days, 1);
    Store.set({ points: pts });
  }

  function markNotifRead(idx) {
    const notifs = Store.get('notifications') || [];
    if (notifs[idx]) { notifs[idx].read = true; Store.set({ notifications: notifs }); render(); }
  }
  window.markNotifRead = markNotifRead;

  function markAllRead() {
    const notifs = (Store.get('notifications') || []).map(n => ({ ...n, read: true }));
    Store.set({ notifications: notifs });
    render();
  }
  window.markAllRead = markAllRead;

  // --- Initialize ---
  Store.init();
  Store.subscribe(() => Store.save());
  render();

  </script>
</body>
</html>
